name: Stage firmware for Config Editor
description: Downloads the firmware-zip artifact and unpacks it into the Tauri resources directory.

inputs:
  version:
    description: Firmware version string (matches the artifact filename uploaded by build-zip).
    required: true

runs:
  using: composite
  steps:
    - name: Download firmware zip
      uses: actions/download-artifact@v7
      with:
        # build-zip uploads with `archive: false`, so the artifact name is the
        # literal filename (`action.yml#52`): `midicaptain-firmware-<ver>.zip`.
        name: midicaptain-firmware-${{ inputs.version }}.zip
        path: ci-artifacts/firmware-zip

    - name: Stage firmware into Config Editor resources
      shell: bash
      env:
        # With `archive: false` on upload, the artifact's basename *is* the
        # filename. download-artifact's layout for that case is not obvious, so
        # use `find` and fail loudly if nothing is present.
        VERSION: ${{ inputs.version }}
      run: |
        set -x
        ls -laR ci-artifacts/firmware-zip
        ZIP="$(find ci-artifacts/firmware-zip -type f -name '*.zip' | head -1)"
        if [[ -z "$ZIP" ]]; then
          echo "::error::No .zip file found under ci-artifacts/firmware-zip (looking for midicaptain-firmware-${VERSION}.zip)"
          exit 1
        fi
        unzip -o "$ZIP" -d config-editor/src-tauri/resources/firmware/
        ls -la config-editor/src-tauri/resources/firmware/
