name: Stage firmware for Config Editor
description: Downloads the firmware-zip artifact and unpacks it into the Tauri resources directory.

inputs:
  version:
    description: Firmware version string (matches the artifact filename uploaded by build-zip).
    required: true

runs:
  using: composite
  steps:
    - name: Download firmware zip
      uses: actions/download-artifact@v7
      with:
        # build-zip uploads with `archive: false`, so the artifact name is the
        # literal filename (`action.yml#52`): `midicaptain-firmware-<ver>.zip`.
        name: midicaptain-firmware-${{ inputs.version }}.zip
        path: ci-artifacts/firmware-zip

    - name: Stage firmware into Config Editor resources
      shell: bash
      run: |
        unzip -o ci-artifacts/firmware-zip/*.zip -d config-editor/src-tauri/resources/firmware/
        ls -la config-editor/src-tauri/resources/firmware/
