name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - docs/**

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      semver: ${{ steps.version.outputs.SEMVER }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for git describe

      - name: Get version info
        id: version
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          # Strip 'v' prefix and commit-distance suffix for semver (e.g. v1.5.0-11-gabc1234 → 1.5.0)
          SEMVER=$(echo "$VERSION" | sed 's/^v//' | sed 's/-[0-9]*-g[a-f0-9]*$//')
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "SEMVER=${SEMVER}" >> $GITHUB_OUTPUT
          echo "Building version: \`$VERSION\` (semver: \`$SEMVER\`)" >> $GITHUB_STEP_SUMMARY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check firmware/dev/ --ignore=E501,F401,E402

      - name: Check Python syntax
        run: |
          find firmware/dev -name "*.py" -not -path "*/experiments/*" -exec python -m py_compile {} \;

      - name: CircuitPython 7.x compatibility guard
        run: |
          # Flag Python features that CircuitPython 7.x doesn't support.
          # These pass py_compile (valid CPython) but crash on the device.
          ERRORS=0

          # Dict unpacking in literals: {**d, "k": v}
          if grep -rn '{\s*\*\*' firmware/dev/ --include="*.py" | grep -v experiments/; then
            echo "::error::Dict unpacking ({**dict}) is not supported in CircuitPython 7.x"
            ERRORS=$((ERRORS + 1))
          fi

          # Walrus operator: :=
          if grep -rn ':=' firmware/dev/ --include="*.py" | grep -v experiments/; then
            echo "::error::Walrus operator (:=) is not supported in CircuitPython 7.x"
            ERRORS=$((ERRORS + 1))
          fi

          # match/case (Python 3.10+)
          if grep -rn '^[[:space:]]*match ' firmware/dev/ --include="*.py" | grep -v experiments/; then
            echo "::error::match/case is not supported in CircuitPython 7.x"
            ERRORS=$((ERRORS + 1))
          fi

          if [ "$ERRORS" -gt 0 ]; then
            exit 1
          fi
          echo "No CircuitPython compatibility issues found"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: config-editor/package-lock.json

      - name: Check generated types and TypeScript
        run: |
          cd config-editor
          npm ci
          npm run generate:types
          if ! git diff --quiet src/lib/types.generated.ts; then
            echo "ERROR: types.generated.ts is out of date with config.schema.json"
            echo "Run 'cd config-editor && npm run generate:types' and commit the result."
            git diff src/lib/types.generated.ts
            exit 1
          fi
          echo "types.generated.ts is up to date."
          npm run check

  test-config-editor-rust:
    name: Test Config Editor (Rust)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: config-editor/src-tauri

      # Tauri's build script validates that every bundle.resources glob in
      # tauri.conf.json matches at least one file. resources/circuitpython/*.uf2
      # is fetched on demand by tools/fetch-cp-uf2.sh (issue #134), so we run
      # it here too — otherwise `cargo test` fails before any test runs.
      - name: Stage CircuitPython .uf2 (needed by Tauri build script)
        run: ./tools/fetch-cp-uf2.sh

      - name: Run Rust tests
        working-directory: config-editor/src-tauri
        run: cargo test

  test-site-e2e:
    name: Test Home Page (Playwright)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      # Test what actually deploys: refresh the vendored firmware copies the
      # demo runs (same step pages.yml does on deploy).
      - name: Sync firmware modules into site
        run: tools/sync-site-firmware.sh

      - name: Install dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  build-zip:
    name: Build Firmware Zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Download mpy-cross for CircuitPython 7.x
        run: |
          # Download the CircuitPython-specific mpy-cross (NOT the MicroPython pip package).
          # The pip `mpy-cross` package produces MicroPython-format .mpy files which are
          # incompatible with CircuitPython. Must use Adafruit's build from S3.
          MPY_CROSS_URL="https://adafruit-circuit-python.s3.amazonaws.com/bin/mpy-cross/linux-amd64/mpy-cross.static-amd64-linux-7.3.3"
          curl -sL "$MPY_CROSS_URL" -o /usr/local/bin/mpy-cross
          chmod +x /usr/local/bin/mpy-cross
          echo "mpy-cross version:"
          mpy-cross --version || true

      - name: CircuitPython parse check (all .py files)
        run: |
          # Parse every firmware/dev/*.py through CircuitPython's mpy-cross to
          # catch syntax CPython accepts but the device rejects (e.g. adjacent
          # f-string concatenation, which py_compile passes but CP 7.x cannot
          # parse). Output is discarded — this is a parse-validation pass.
          # Covers code.py and boot.py, which are shipped as .py and otherwise
          # never see the CircuitPython parser in CI.
          FAILED=0
          while IFS= read -r f; do
            if ! mpy-cross -o /tmp/_parse_check.mpy "$f" 2>&1; then
              echo "::error file=$f::CircuitPython parse failed"
              FAILED=$((FAILED + 1))
            fi
          done < <(find firmware/dev -name "*.py" -not -path "*/experiments/*")
          rm -f /tmp/_parse_check.mpy
          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED file(s) failed CircuitPython parse check"
            exit 1
          fi
          echo "All firmware/dev .py files parse cleanly under CircuitPython mpy-cross"

      - name: Compile .py to .mpy
        run: |
          cd firmware/dev
          # Compile core/ and devices/ modules to .mpy bytecode.
          # This reduces file sizes ~30-50% and eliminates parse/compile
          # time on the device, improving both flash speed and boot time.
          # -O2 strips docstrings and assertions for smallest output.
          for f in core/__init__.py core/button.py core/colors.py core/config.py core/hid.py; do
            mpy-cross -O2 "$f" && rm "$f"
          done
          for f in devices/std10.py devices/mini6.py devices/nano4.py devices/duo2.py devices/one1.py; do
            mpy-cross -O2 "$f" && rm "$f"
          done
          # Compile adafruit_hid library (our own implementation shipped in lib/)
          for f in lib/adafruit_hid/__init__.py lib/adafruit_hid/keyboard.py lib/adafruit_hid/keycode.py lib/adafruit_hid/mouse.py; do
            mpy-cross -O2 "$f" && rm "$f"
          done
          # Remove empty __init__.py (no value as .mpy)
          rm -f devices/__init__.py
          echo "Compiled .py → .mpy:"
          ls -la core/ devices/ lib/adafruit_hid/

      - name: Write VERSION file
        run: |
          VERSION="${{ needs.lint.outputs.version }}"
          echo "$VERSION" > firmware/dev/VERSION.txt

      - name: Generate firmware manifest
        run: |
          cd firmware/dev
          # Generate checksums for incremental updates. The installer compares
          # this manifest against the device's existing one to skip unchanged files.
          find . -type f \
            -not -name "*.pyc" \
            -not -path "*/__pycache__/*" \
            -not -path "*/experiments/*" \
            -not -name "firmware.md5" \
            | sort \
            | xargs md5sum > firmware.md5
          echo "Generated firmware.md5 with $(wc -l < firmware.md5) entries"

      - name: Create firmware zip
        run: |
          VERSION="${{ needs.lint.outputs.version }}"
          mkdir -p dist
          cd firmware/dev
          zip -r "../../dist/midicaptain-firmware-${VERSION}.zip" \
            INSTALL.md \
            code.py \
            boot.py \
            config*.json \
            core/ \
            devices/ \
            fonts/ \
            lib/ \
            firmware.md5 \
            VERSION.txt \
            -x "*.pyc" -x "*/__pycache__/*" -x "*/__pycache__" -x "experiments/*"
          cd ../..
          # Add deploy scripts to root of zip (using -j to strip path)
          zip -j "dist/midicaptain-firmware-${VERSION}.zip" tools/deploy.sh tools/deploy.ps1 tools/deploy.bat
          echo "Created: \`dist/midicaptain-firmware-${VERSION}.zip\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          # `archive: false` skips GitHub's outer zip wrapper — our payload is
          # already a zip. The `name:` input is ignored in this mode; the
          # artifact name is taken from the file's basename, which keeps the
          # versioned `midicaptain-firmware-<ver>.zip` contract that
          # release.yml expects.
          path: dist/midicaptain-firmware-${{ needs.lint.outputs.version }}.zip
          archive: false
          retention-days: 90

  build-config-editor-macos:
    name: Build Config Editor (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint, build-zip]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Stage firmware for Config Editor
        uses: ./.github/actions/stage-firmware-for-editor
        with:
          version: ${{ needs.lint.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: config-editor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: config-editor/src-tauri

      - name: Import code signing certificate
        env:
          MACOS_APPLICATION_CERT: ${{ secrets.MACOS_APPLICATION_CERT }}
          MACOS_APPLICATION_CERT_PWD: ${{ secrets.MACOS_APPLICATION_CERT_PWD }}
        run: |
          # Skip if certificate not configured
          if [ -z "$MACOS_APPLICATION_CERT" ]; then
            echo "⚠️ Code signing certificate not configured - building unsigned" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          echo "$MACOS_APPLICATION_CERT" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" \
            -P "$MACOS_APPLICATION_CERT_PWD" -T /usr/bin/codesign
          rm certificate.p12
          
          # Set as default keychain
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          echo "✓ Code signing certificate imported" >> $GITHUB_STEP_SUMMARY

      - name: Install frontend dependencies
        run: |
          cd config-editor
          npm install

      - name: Patch version in config editor
        uses: ./.github/actions/patch-config-editor-version
        with:
          semver: ${{ needs.lint.outputs.semver }}

      - name: Build Tauri app (universal binary)
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Maximilian Cascone (9WNXKEF4SM)"
        run: |
          cd config-editor
          npm run tauri build -- --target universal-apple-darwin
          ls -lah src-tauri/target/universal-apple-darwin/release/bundle/

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Skip if notarization credentials not configured
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_PASSWORD" ]; then
            echo "⚠️ Notarization credentials not configured - skipping" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          DMG_PATH=$(find config-editor/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::DMG not found after build"
            exit 1
          fi
          
          echo "Notarizing: $DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"
          echo "✓ DMG notarized and stapled" >> $GITHUB_STEP_SUMMARY

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-editor-dmg
          path: config-editor/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 90

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-editor-app
          path: config-editor/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          retention-days: 90

  build-config-editor-windows:
    name: Build Config Editor (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [lint, build-zip]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Stage firmware for Config Editor
        uses: ./.github/actions/stage-firmware-for-editor
        with:
          version: ${{ needs.lint.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: config-editor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: config-editor/src-tauri

      - name: Install frontend dependencies
        run: |
          cd config-editor
          npm install

      - name: Compute WiX-safe version
        id: wix-version
        shell: bash
        run: |
          SEMVER="${{ needs.lint.outputs.semver }}"
          # WiX requires a single numeric pre-release identifier (0-65535).
          # Extract base version and first number from suffix:
          # 1.8.0-rc1-6 → 1.8.0-1, 1.8.0-rc1 → 1.8.0-1, 1.5.0-11 → 1.5.0-11
          BASE=$(echo "$SEMVER" | sed 's/-.*//')
          SUFFIX=$(echo "$SEMVER" | sed -n 's/^[^-]*-//p')
          BUILD=$(echo "$SUFFIX" | sed -n 's/[^0-9]*\([0-9]\{1,\}\).*/\1/p')
          if [ -n "$BUILD" ]; then
            WIX_SEMVER="${BASE}-${BUILD}"
          else
            WIX_SEMVER="${BASE}"
          fi
          echo "SEMVER=${WIX_SEMVER}" >> $GITHUB_OUTPUT
          echo "WiX version: $SEMVER → $WIX_SEMVER" >> $GITHUB_STEP_SUMMARY

      - name: Patch version in config editor
        uses: ./.github/actions/patch-config-editor-version
        with:
          semver: ${{ steps.wix-version.outputs.SEMVER }}

      - name: Build Tauri app
        run: |
          cd config-editor
          npm run tauri build
          Get-ChildItem -Path src-tauri\target\release\bundle\ -Recurse

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-editor-msi
          path: config-editor/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 90

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-editor-nsis
          path: config-editor/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 90

      - name: Build summary
        shell: bash
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✓ Successfully built Config Editor for Windows" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **MSI Installer** (Windows Installer format)" >> $GITHUB_STEP_SUMMARY
          echo "- **NSIS Installer** (Setup executable format)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Notes" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Builds are unsigned. Users will see Windows SmartScreen warning." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`docs/windows-build.md\` for code signing setup." >> $GITHUB_STEP_SUMMARY

  build-config-editor-linux:
    name: Build Config Editor (Linux ${{ matrix.arch }})
    # Pin to 22.04 (not ubuntu-latest): the AppImage/deb link against the
    # runner's glibc, so building on the oldest supported runner keeps the
    # artifacts runnable on the widest range of user distros.
    # Native matrix: amd64 + arm64. GitHub's arm64 hosted runner
    # (ubuntu-22.04-arm) is free for public repos, so no cross-compilation.
    strategy:
      fail-fast: false   # an arm64 hiccup shouldn't kill the amd64 build
      matrix:
        include:
          - { runner: ubuntu-22.04,     arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: [lint, build-zip]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Stage firmware for Config Editor
        uses: ./.github/actions/stage-firmware-for-editor
        with:
          version: ${{ needs.lint.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          cache-dependency-path: config-editor/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: config-editor/src-tauri

      - name: Install system dependencies
        run: |
          # Tauri 2 Linux build deps (webkit2gtk 4.1 + bundler tooling) plus
          # libudev-dev for the serialport crate. libfuse2 lets the AppImage
          # bundler run linuxdeploy on the FUSE-less runner. xdg-utils provides
          # /usr/bin/xdg-open, which the AppImage bundler requires — it's
          # preinstalled on the amd64 runner image but NOT the arm64 one.
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev \
            libfuse2 \
            xdg-utils \
            file \
            build-essential \
            curl \
            wget

      - name: Install frontend dependencies
        run: |
          cd config-editor
          npm install

      - name: Patch version in config editor
        uses: ./.github/actions/patch-config-editor-version
        with:
          semver: ${{ needs.lint.outputs.semver }}

      - name: Build Tauri app (AppImage + deb)
        env:
          # Run the bundler's linuxdeploy AppImage by extraction instead of via
          # FUSE — GitHub runners have no FUSE device.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cd config-editor
          npm run tauri build -- --bundles appimage,deb
          ls -lah src-tauri/target/release/bundle/appimage/ src-tauri/target/release/bundle/deb/

      - name: Import GPG key
        id: import-gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Mirrors the Linux signing mechanism from boomerang-plugin.
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::No GPG key configured — Linux artifacts will not be signed"
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep sec | awk '{print $2}' | cut -d'/' -f2 | head -1)
          if [ -z "$KEY_ID" ]; then
            echo "::error::Failed to import GPG secret key."
            exit 1
          fi

          echo "KEY_ID=$KEY_ID" >> "$GITHUB_OUTPUT"
          echo "can_sign=true" >> "$GITHUB_OUTPUT"
          echo "✓ GPG key imported ($KEY_ID)" >> "$GITHUB_STEP_SUMMARY"

      - name: Sign Linux artifacts
        if: steps.import-gpg.outputs.can_sign == 'true'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd config-editor/src-tauri/target/release/bundle
          # Detached, ASCII-armored signature per artifact; verify each one.
          while IFS= read -r artifact; do
            echo "Signing: $artifact"
            echo "$GPG_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
              --pinentry-mode loopback --armor --detach-sign \
              --output "${artifact}.asc" "$artifact"

            gpg --verify "${artifact}.asc" "$artifact" 2>&1 | tee verify.log
            if grep -q "Good signature" verify.log; then
              echo "✓ Signature verified: $(basename "$artifact").asc" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::Signature verification failed for $artifact"
              exit 1
            fi
          done < <(find appimage deb -type f \( -name "*.AppImage" -o -name "*.deb" \))
          rm -f verify.log

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-editor-appimage-${{ matrix.arch }}
          path: |
            config-editor/src-tauri/target/release/bundle/appimage/*.AppImage
            config-editor/src-tauri/target/release/bundle/appimage/*.AppImage.asc
          retention-days: 90

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: config-editor-deb-${{ matrix.arch }}
          path: |
            config-editor/src-tauri/target/release/bundle/deb/*.deb
            config-editor/src-tauri/target/release/bundle/deb/*.deb.asc
          retention-days: 90

      - name: Build summary
        run: |
          echo "## Linux Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✓ Successfully built Config Editor for Linux" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "- **AppImage** (portable, runs on most distros)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **deb** (Debian / Ubuntu package)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.import-gpg.outputs.can_sign }}" = "true" ]; then
            echo "🔏 Artifacts signed with detached GPG signatures (\`.asc\`)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Unsigned — set \`GPG_PRIVATE_KEY\` / \`GPG_PASSPHRASE\` secrets to sign. See \`docs/linux-build.md\`." >> "$GITHUB_STEP_SUMMARY"
          fi

