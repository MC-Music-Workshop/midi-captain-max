name: CoreMIDI probe

# Measures whether short-lived CoreMIDI clients (one `sendmidi` per message)
# fail on each GitHub-hosted macOS version. On macOS 27.2 they fail every
# ~7-10 s with -304 when no other MIDI client is open (see
# tools/coremidi-probe/run.py and gbevin/SendMIDI#66). Informational: it never
# fails on what it measures, only if the probe itself can't run.
#
# Standard macOS runners are free for public repos; the -large/-xlarge labels
# are billed, so don't add them. There is no hosted macOS 27 runner yet: run
# tools/coremidi-probe/run.py locally for 27.x.
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Calls per mode"
        default: "120"
  push:
    paths:
      - ".github/workflows/coremidi-probe.yml"
      - "tools/coremidi-probe/**"

jobs:
  probe:
    name: macOS probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@v7

      - name: Install sendmidi and receivemidi
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install gbevin/tools/sendmidi gbevin/tools/receivemidi

      - name: Build the CoreMIDI probe
        run: xcrun swiftc -O -o probe tools/coremidi-probe/probe.swift

      - name: Run the probe
        run: >
          python3 tools/coremidi-probe/run.py --probe ./probe
          --count "${{ inputs.count || '120' }}"
          --json "coremidi-probe-${{ matrix.os }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: coremidi-probe-${{ matrix.os }}
          path: coremidi-probe-${{ matrix.os }}.json
