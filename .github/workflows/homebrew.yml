name: Homebrew

# Bumps the cask in MC-Music-Workshop/homebrew-tap when a stable release is
# published. Stable releases start as drafts (release.yml) and are published by
# hand in the GitHub UI, which fires `release: published`. Releases published by
# GITHUB_TOKEN (beta/rc auto-publish) don't trigger workflows, and are
# prereleases anyway.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish to the tap (e.g. v1.14.0)"
        required: true

jobs:
  bump-cask:
    name: Bump Homebrew cask
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check tap token
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping cask bump"
            echo "present=false" >> $GITHUB_OUTPUT
          else
            echo "present=true" >> $GITHUB_OUTPUT
          fi

      - name: Reject prerelease tags
        if: steps.token.outputs.present == 'true'
        run: |
          # Tag format is v{major}.{minor}.{patch}[-{prerelease}]; any "-" means prerelease.
          if [[ "$TAG" == *-* ]]; then
            echo "::error::$TAG is a prerelease tag; the tap only tracks stable releases"
            exit 1
          fi

      - uses: actions/checkout@v6
        if: steps.token.outputs.present == 'true'
        with:
          repository: MC-Music-Workshop/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask version and sha256
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          gh release download "$TAG" -R "${{ github.repository }}" \
            -p "MIDI-Captain-MAX-Config-Editor-${TAG}.dmg" -O cask.dmg
          SHA256=$(sha256sum cask.dmg | cut -d' ' -f1)
          rm cask.dmg

          sed -i -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            Casks/midi-captain-max.rb
          git diff

          if git diff --quiet; then
            echo "Cask already at ${VERSION}" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "midi-captain-max ${VERSION}"
          git push
          echo "✓ Homebrew cask bumped to ${VERSION} (sha256 ${SHA256})" >> $GITHUB_STEP_SUMMARY
