name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'tools/fetch-board.sh', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 6 * * *'  # daily, keeps the Kanban snapshot fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Refresh the Kanban snapshot; if the token can't read the org project,
      # the committed site/board.json stays as a (stale but valid) fallback.
      - name: Refresh board snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: tools/fetch-board.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v5
