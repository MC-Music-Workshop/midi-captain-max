name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/fetch-board.sh'
      - '.github/workflows/pages.yml'
      # The live demo runs these firmware modules; redeploy when they change.
      - 'firmware/dev/core/button.py'
      - 'firmware/dev/core/colors.py'
      - 'firmware/dev/core/display_model.py'
      - 'tools/sync-site-firmware.sh'
  schedule:
    - cron: '17 6 * * *'  # daily, keeps the Kanban snapshot fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Refresh the Kanban snapshot; if the token can't read the org project,
      # the committed site/board.json stays as a (stale but valid) fallback.
      - name: Refresh board snapshot
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: tools/fetch-board.sh
      # The demo runs the literal firmware button logic; sync the copies so
      # the deployed site always matches what's on main.
      - name: Sync firmware modules into site
        run: tools/sync-site-firmware.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      # deploy-pages intermittently fails with a transient "Deployment failed,
      # try again later" from the Pages backend; a single retry after a pause
      # has recovered it every time.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
