name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  hardware-test:
    name: Hardware Test (${{ matrix.device }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false  # run every device even if one fails — full picture
      matrix:
        device: [std10, mini6, nano4]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.11
          cache: pip
          cache-dependency-path: requirements-smoke.txt

      - name: Install dependencies
        run: pip install -r requirements-smoke.txt

      - name: Install wokwi-cli
        run: curl -L https://wokwi.com/ci/install.sh | sh

      # Presses simulated footswitches and asserts the firmware's MIDI output.
      # test.sh downloads the CP runtime UF2, builds the per-device bundle from
      # firmware/dev (the same source deploy.sh ships), and runs the scenario.
      - name: Run ${{ matrix.device }} hardware test
        id: hwtest
        env:
          WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
        run: ./emulator/test.sh ${{ matrix.device }}
        # Non-blocking: a failure is reported (next step) but does NOT stop the
        # release. To make it a hard gate, delete this line — see emulator/README.md.
        # With continue-on-error, steps.hwtest.outcome holds the true pass/fail.
        continue-on-error: true

      # Always report the result (pass AND fail) to the run summary + an
      # annotation, so the non-blocking outcome is visible on every release.
      - name: Report ${{ matrix.device }} result
        if: always()
        run: |
          if [ "${{ steps.hwtest.outcome }}" = "success" ]; then
            echo "✅ **${{ matrix.device }}** hardware test passed" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Hardware test (${{ matrix.device }})::passed"
          else
            echo "❌ **${{ matrix.device }}** hardware test FAILED (non-blocking — release not stopped)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Hardware test (${{ matrix.device }})::FAILED (non-blocking — see job log)"
          fi

  release:
    name: Create Release
    needs: hardware-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      VERSION: ""  # satisfies linter, is set dynamically from tag in first step
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$TAG" >> $GITHUB_ENV

      - name: Wait for CI to complete
        id: get-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Find the CI run triggered by this tag push and wait for it.
          SHA="${{ github.sha }}"

          # Give CI a moment to start
          sleep 10

          RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=1" \
            --jq '.workflow_runs[0].id')

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No CI run found for commit ${SHA}."
            exit 1
          fi

          # Block until the run completes; exits non-zero if it fails
          gh run watch "$RUN_ID" --exit-status

          echo "RUN_ID=$RUN_ID" >> $GITHUB_OUTPUT
          echo "CI run $RUN_ID completed successfully" >> $GITHUB_STEP_SUMMARY

      - name: Download all artifacts from CI
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.get-run.outputs.RUN_ID }}
          path: ci-artifacts

      - name: Prepare release assets
        run: |
          mkdir -p dist

          echo "Downloaded artifacts:"
          ls -la ci-artifacts/

          # download-artifact@v7 extracts the firmware zip on download, so the
          # artifact arrives as a directory of loose files. Patch VERSION.txt (CI
          # built it from git-describe pre-tag), then re-zip as the release asset.
          FIRMWARE_DIR=$(find ci-artifacts -maxdepth 1 -type d -name "midicaptain-firmware-*" | head -1)
          if [ -n "$FIRMWARE_DIR" ]; then
            echo "$VERSION" > "$FIRMWARE_DIR/VERSION.txt"
            (cd "$FIRMWARE_DIR" && zip -r "$OLDPWD/dist/midicaptain-firmware-${VERSION}.zip" .)
            echo "✓ Firmware zip: midicaptain-firmware-${VERSION}.zip" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Firmware artifact dir not found in CI artifacts"
            exit 1
          fi

          # Create "latest" zip for stable download URL (used by Gumroad)
          cp "dist/midicaptain-firmware-${VERSION}.zip" "dist/midi-captain-max-latest.zip"
          echo "✓ Latest zip: midi-captain-max-latest.zip" >> $GITHUB_STEP_SUMMARY
          
          # Find and rename config editor DMG
          DMG_FILE=$(find ci-artifacts -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}.dmg"
            echo "✓ Config Editor DMG: MIDI-Captain-MAX-Config-Editor-${VERSION}.dmg" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Config Editor DMG not found in CI artifacts"
          fi
          
          # Find and rename config editor MSI (Windows)
          MSI_FILE=$(find ci-artifacts -name "*.msi" | head -1)
          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}.msi"
            echo "✓ Config Editor MSI: MIDI-Captain-MAX-Config-Editor-${VERSION}.msi" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Config Editor MSI not found in CI artifacts"
          fi
          
          # Find and rename config editor NSIS installer (Windows)
          # Tauri generates filename from productName: "MIDI Captain MAX Config Editor"
          # Pattern is resilient to filename variations
          NSIS_FILE=$(find ci-artifacts -name "*-setup.exe" | grep -i "config-editor\|captain" | head -1)
          if [ -n "$NSIS_FILE" ]; then
            cp "$NSIS_FILE" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}-setup.exe"
            echo "✓ Config Editor NSIS: MIDI-Captain-MAX-Config-Editor-${VERSION}-setup.exe" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Config Editor NSIS installer not found in CI artifacts"
          fi

          # Find and rename config editor AppImage + deb (Linux), per arch.
          # Glob by the CI artifact directory (config-editor-{appimage,deb}-${arch})
          # rather than Tauri's filename arch token — Tauri stamps "aarch64" into
          # AppImage names but "arm64" into deb names, so keying off the artifact
          # dir we control keeps matching reliable. Copy the detached GPG
          # signature (.asc) alongside each, renamed to match the friendly asset
          # name — gpg verifies by content, so renaming is safe.
          for arch in amd64 arm64; do
            APPIMAGE_FILE=$(find "ci-artifacts/config-editor-appimage-${arch}" -name "*.AppImage" 2>/dev/null | head -1)
            if [ -n "$APPIMAGE_FILE" ]; then
              cp "$APPIMAGE_FILE" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.AppImage"
              echo "✓ Config Editor AppImage (${arch}): MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.AppImage" >> $GITHUB_STEP_SUMMARY
              if [ -f "${APPIMAGE_FILE}.asc" ]; then
                cp "${APPIMAGE_FILE}.asc" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.AppImage.asc"
                echo "✓ AppImage signature (${arch}): MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.AppImage.asc" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "::warning::Config Editor AppImage (${arch}) not found in CI artifacts"
            fi

            DEB_FILE=$(find "ci-artifacts/config-editor-deb-${arch}" -name "*.deb" 2>/dev/null | head -1)
            if [ -n "$DEB_FILE" ]; then
              cp "$DEB_FILE" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.deb"
              echo "✓ Config Editor deb (${arch}): MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.deb" >> $GITHUB_STEP_SUMMARY
              if [ -f "${DEB_FILE}.asc" ]; then
                cp "${DEB_FILE}.asc" "dist/MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.deb.asc"
                echo "✓ deb signature (${arch}): MIDI-Captain-MAX-Config-Editor-${VERSION}_${arch}.deb.asc" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "::warning::Config Editor deb (${arch}) not found in CI artifacts"
            fi
          done

          ls -la dist/

      - name: Stage CircuitPython .uf2 for the combined bundle (issue #134)
        run: ./tools/fetch-cp-uf2.sh

      - name: Create combined bundle (firmware + all GUI installers + CP .uf2)
        run: |
          mkdir -p bundle
          # Copy firmware zip contents (extract so bundle is flat, not a zip-in-zip)
          cp "dist/midicaptain-firmware-${VERSION}.zip" bundle/
          # Copy all GUI installers that were found (incl. Linux + .asc sigs)
          for ext in dmg msi exe AppImage deb asc; do
            for f in dist/*."$ext"; do
              [ -f "$f" ] && cp "$f" bundle/
            done
          done
          # CP .uf2 for terminal-only users who can't use the GUI reflash button.
          cp config-editor/src-tauri/resources/circuitpython/*.uf2 bundle/
          # Create the combined zip
          (cd bundle && zip -r "../dist/MIDI-Captain-MAX-${VERSION}-complete.zip" .)
          echo "✓ Complete bundle: MIDI-Captain-MAX-${VERSION}-complete.zip" >> $GITHUB_STEP_SUMMARY
          ls -la dist/

      - name: Generate Release Note Header
        id: header
        run: |
          echo "PRERELEASE=false" >> $GITHUB_OUTPUT # default to 'latest' for now
          echo "DRAFT=true" >> $GITHUB_OUTPUT # default to draft; auto-publish only for beta
          if [[ "$VERSION" == *"alpha"* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "NOTES=⚠️ **Alpha Release** - For testing only. Not recommended for production use." >> $GITHUB_ENV
          elif [[ "$VERSION" == *"beta"* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "DRAFT=false" >> $GITHUB_OUTPUT # beta releases auto-publish
            echo "NOTES=🧪 **Beta Release** - Feature complete, undergoing final testing." >> $GITHUB_ENV
          elif [[ "$VERSION" == *"rc"* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "DRAFT=false" >> $GITHUB_OUTPUT # rc releases auto-publish
            echo "NOTES=🚀 **Release Candidate** - Final testing before stable release." >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "NOTES=✅ **Stable Release**" >> $GITHUB_ENV
          fi

      - name: Generate Release Notes Body
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate the "What's Changed" changelog via the API so we control placement
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(gh api repos/${{ github.repository }}/releases/generate-notes \
              -f tag_name="$VERSION" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body' 2>/dev/null || echo "")
          fi

          # Build final body: header + changelog + installation instructions
          envsubst < tools/release_notes.md > release_notes_processed.txt
          {
            echo "BODY<<RELEASE_BODY_EOF"
            head -1 release_notes_processed.txt
            echo ""
            if [ -n "$CHANGELOG" ]; then
              echo "$CHANGELOG"
              echo ""
            fi
            # Append everything after the first line (installation instructions)
            tail -n +2 release_notes_processed.txt
            echo ""
            echo "RELEASE_BODY_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ steps.header.outputs.DRAFT }}
          prerelease:  ${{ steps.header.outputs.PRERELEASE }}
          make_latest: ${{ steps.header.outputs.PRERELEASE != 'true' }}
          files: dist/*
          body: ${{ steps.notes.outputs.BODY }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Release
        run: |
          {
            if [ "${{ steps.header.outputs.DRAFT }}" = "true" ]; then
              echo "## Draft release \`$VERSION\` created"
              echo ""
              echo "Release URL: ${{ steps.create_release.outputs.url }}"
              echo ""
              echo "**Next steps:** Download and test the artifacts, then publish the release."
            else
              echo "## Release \`$VERSION\` published"
              echo ""
              echo "Release URL: ${{ steps.create_release.outputs.url }}"
            fi
          } >> $GITHUB_STEP_SUMMARY

