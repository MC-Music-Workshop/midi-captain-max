name: Validate Configs

on:
  push:
    paths:
      - 'config.schema.json'
      - 'firmware/dev/config*.json'
      - 'config-editor/src/lib/types.generated.ts'
      - '.github/workflows/validate-configs.yml'
  pull_request:
    paths:
      - 'config.schema.json'
      - 'firmware/dev/config*.json'
      - 'config-editor/src/lib/types.generated.ts'
      - '.github/workflows/validate-configs.yml'

jobs:
  validate-schema:
    name: Validate config files against schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install ajv-cli
        run: npm install -g ajv-cli

      - name: Validate all config files
        run: |
          echo "Validating firmware config files..."
          for f in firmware/dev/config*.json; do
            echo "  $f"
            ajv validate -s config.schema.json -d "$f"
          done

  check-types-freshness:
    name: Check generated types are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: config-editor
        run: npm ci

      - name: Regenerate types
        working-directory: config-editor
        run: npm run generate:types

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet config-editor/src/lib/types.generated.ts; then
            echo "ERROR: types.generated.ts is out of date with config.schema.json"
            echo "Run 'cd config-editor && npm run generate:types' and commit the result."
            git diff config-editor/src/lib/types.generated.ts
            exit 1
          fi
          echo "types.generated.ts is up to date."
