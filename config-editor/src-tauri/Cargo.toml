[package]
name = "config-editor"
version = "0.1.0"
description = "Configuration editor for MIDI Captain foot controllers"
authors = ["Maximilian Cascone <max@mcmusicworkshop.com>"]
edition = "2021"
# Two binaries (the app and `mcm-mcp`): `cargo run` / `tauri dev` start the app.
default-run = "config-editor"
license = "Proprietary"
homepage = "https://github.com/mcascone/midi-captain-max"
repository = "https://github.com/mcascone/midi-captain-max"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "config_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
dirs = "5"
serialport = "4"
md-5 = "0.10"
hex = "0.4"
# mcm-mcp (#230): MCP stdio server. Tools are listed by hand from agent/tools.json, so no macros/schemars.
rmcp = { version = "3", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt"] }
# Agent `validate` (#230) checks configs against config.schema.json; no remote $ref resolving.
jsonschema = { version = "0.61", default-features = false }
# The Assistant's API key lives in the OS credential store (secrets.rs).
keyring = "4"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "winbase", "winnt", "minwindef"] }

[dev-dependencies]
tempfile = "3"

